name: Go CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GOPATH: ${{ github.workspace }}
      GO111MODULE: off

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Lint Go formatting
        run: |
          cd src
          files=$(find . -name '*.go' | sort | xargs gofmt -l)
          if [ -n "$files" ]; then
            echo "The following files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Verify Go examples
        run: |
          cd src
          for dir in $(find . -mindepth 1 -maxdepth 1 -type d | sort); do
            echo "Checking $dir"
            if [ "$dir" = "./encap" ]; then
              echo "Expected failure for intentionally broken example $dir"
              if (cd "$dir" && go test ./...); then
                echo "Unexpected success for intentionally broken example"
                exit 1
              fi
              continue
            fi
            (cd "$dir" && go test ./...) || exit 1
          done
